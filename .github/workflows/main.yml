name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Auto-generate Android Project Structure
        run: |
          flutter create . --org com.pickprime.superutility --platforms android

      - name: Fix Kotlin & Gradle Versions
        run: |
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.22'/" android/build.gradle || true
          sed -i "s/ext.kotlin_version=.*/ext.kotlin_version='1.9.22'/" android/build.gradle || true
          sed -i "s/com.android.tools.build:gradle:.*/com.android.tools.build:gradle:8.1.0'/" android/build.gradle || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
